name: Deploy docs with Kamal

on:
  push:
    branches: [main]
  workflow_dispatch:

# One concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Kamal
        run: gem install kamal

      - name: Install Bitwarden Secrets Manager CLI (bws)
        run: |
          BWS_VERSION="$(curl -fsSL https://api.github.com/repos/bitwarden/sdk-sm/releases \
            | jq -r '[.[] | select(.tag_name | startswith("bws-v"))][0].tag_name | ltrimstr("bws-v")')"
          curl -fsSLo bws.zip \
            "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${BWS_VERSION}/bws-x86_64-unknown-linux-gnu-${BWS_VERSION}.zip"
          sudo unzip -o bws.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/bws
          bws --version

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H \
            "$(ruby -ryaml -e "puts YAML.safe_load(File.read('config/deploy.yml')).dig('servers','web').first")" \
            >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: kamal deploy
