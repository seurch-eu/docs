name: Deploy

# Autodeploy on every merge to main — but only once the CI workflow has gone
# green for that commit, so a failing build is never shipped. Also runnable
# manually from the Actions tab.
#
# First-time setup (one-off, run locally after filling in config/deploy.yml):
#   kamal setup        # provisions kamal-proxy, boots the Postgres accessory
# CI then runs `kamal deploy` for every subsequent green merge.
#
# Required GitHub Actions secrets:
#   BWS_ACCESS_TOKEN   Bitwarden Secrets Manager machine-account access token
#   SSH_PRIVATE_KEY    Private key authorized on the VPS (for the deploy user)
# Required GitHub Actions variable:
#   VPS_HOST           VPS IP/hostname (same as servers.web in deploy.yml)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: kamal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    # Deploy on a manual run, or when the triggering CI run succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI tested (falls back to the dispatched
          # ref for manual runs).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Ruby (Kamal is a Ruby gem)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        # >= 2.10 for the accessory `directories:` `owner:` key (see deploy.yml).
        run: gem install kamal -v "~> 2.10"

      - name: Install the Bitwarden Secrets Manager CLI (bws)
        env:
          BWS_VERSION: "2.1.0"
        run: |
          curl -fsSLo bws.zip \
            "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${BWS_VERSION}/bws-x86_64-unknown-linux-gnu-${BWS_VERSION}.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o bws.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/bws"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load the VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy with Kamal
        env:
          # bws (via the bitwarden-sm adapter in .kamal/secrets) authenticates
          # with this; everything else is pulled from Bitwarden at deploy time.
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          bws config server-api https://vault.bitwarden.eu/api
          bws config server-identity https://vault.bitwarden.eu/identity
          kamal deploy
