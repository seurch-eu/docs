# Static-site server for the Seurch docs. kamal-proxy terminates TLS in front
# of this and forwards plain HTTP to port 80.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hugo emits pretty-URL directories (…/page/index.html); fall through to a
    # 404 when nothing matches.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hugo renders the theme's 404 to /404.html at the site root.
    error_page 404 /404.html;

    # Long-cache the fingerprinted assets Hugo emits (hashed filenames bust the
    # cache on change); keep HTML uncached so updates show up immediately.
    location ~* \.(css|js|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires    7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Lightweight health endpoint for kamal-proxy (returns 200 with no body).
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
