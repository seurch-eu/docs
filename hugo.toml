baseURL = "https://docs.seurch.eu/"
defaultContentLanguage = "en"
title = "Seurch Docs"
theme = "hugo-book"

# Book theme expects the table of contents under one section; "*" tells it to
# build the sidebar from every top-level section (User guide, Self-hosting, API).
disableKinds = ["taxonomy", "term"]

# Per-page git metadata, drives the "Edit this page" / "last modified" footer
# links below. Gracefully no-ops where no git history is present.
enableGitInfo = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content/en"
  [languages.fr]
    languageName = "Français"
    weight = 2
    title = "Documentation Seurch"
    contentDir = "content/fr"
  [languages.de]
    languageName = "Deutsch"
    weight = 3
    title = "Seurch Dokumentation"
    contentDir = "content/de"

[params]
  # Auto follows the visitor's system light/dark preference.
  BookTheme = "auto"
  # Render the page table of contents in the right column.
  BookToC = true
  # Build the left menu from the content tree (all root sections).
  BookSection = "*"
  # Client-side search across all pages.
  BookSearch = true
  # Show a short "last edited" line; sourced from the git commit date.
  BookDates = true
  # Browser tab icon: the Seurch mark (static/favicon.svg).
  BookFavicon = "favicon.svg"
  # Footer "Edit this page" link → the source file on GitHub.
  BookEditLink = "https://github.com/seurch-eu/docs/edit/main/{{ .Path }}"
  # Footer "last modified" date → the commit on GitHub (needs enableGitInfo).
  BookLastChangeLink = "https://github.com/seurch-eu/docs/commit/{{ .GitInfo.Hash }}"

[markup]
  [markup.goldmark.renderer]
    # Allow the occasional inline HTML (e.g. <kbd> keys) in the docs.
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
    tabWidth = 2

[params.links]
  # External links rendered as a "Links" section at the foot of the sidebar
  # (see layouts/_partials/docs/inject/menu-after.html).
  site = "https://seurch.eu/"
  # No `status` link: the hosted service runs with STATUS_PAGE_ENABLED=false, so
  # /status is not published there (self-hosters can still enable their own, see
  # the Monitoring page).
  engine_repo = "https://github.com/seurch-eu/seurch"
  docs_repo = "https://github.com/seurch-eu/docs"
